# SHK-Backoffice-Plattform. Profile:
#   (ohne)      postgres, migrate, core, worker              docker compose up -d
#   voice       + redis, livekit, livekit-sip, voice-agent   docker compose --profile voice up -d
#   ops         + n8n (Eingangsworkflows)                    docker compose --profile ops up -d
#   auth        + keycloak (OIDC, Realm shk importiert)       docker compose --profile auth up -d
#   ontologie   + Apache Jena Fuseki (SPARQL)                docker compose --profile ontologie up -d
# Fremd-Images sind auf geprüfte Versionen festgelegt (Liste und Spiegel: drittanbieter/IMAGES.txt, drittanbieter/spiegeln.sh --images).
# Betrieb auf einem Server: deploy/server/ (HOSTING.md).

# Datenbankrollen (deploy/postgres/rollen.sql): shk = Eigentümer, nur Migrationen;
# shk_app = Core, unterliegt Row-Level Security; shk_system = Worker/Seed, mandantenübergreifend.
x-core-umgebung: &core-umgebung
  DATABASE_URL: postgresql+psycopg://shk_app:${SHK_APP_PASSWORD}@postgres:5432/shk
  SYSTEM_DATABASE_URL: postgresql+psycopg://shk_system:${SHK_SYSTEM_PASSWORD}@postgres:5432/shk
  CORE_API_KEY: ${CORE_API_KEY}
  OIDC_ISSUER: ${OIDC_ISSUER:-}

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_USER: shk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: shk
      SHK_APP_PASSWORD: ${SHK_APP_PASSWORD}
      SHK_SYSTEM_PASSWORD: ${SHK_SYSTEM_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-}
    volumes:
      - postgres-daten:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro   # nur beim ersten Start (leeres Volume)
      - ./deploy/postgres/rollen.sql:/shk/rollen.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shk -d shk"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    command: ["python", "-m", "core", "migrate"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://shk:${POSTGRES_PASSWORD}@postgres:5432/shk
    depends_on:
      postgres: {condition: service_healthy}

  core:
    build: .
    environment: *core-umgebung
    ports: ["127.0.0.1:8100:8100"]
    depends_on:
      migrate: {condition: service_completed_successfully}

  worker:
    build: .
    command: ["python", "-m", "core", "worker"]
    environment:
      <<: *core-umgebung
      DATABASE_URL: postgresql+psycopg://shk_system:${SHK_SYSTEM_PASSWORD}@postgres:5432/shk
      CSV_EXPORT: /app/export
    volumes: [export:/app/export]
    depends_on:
      core: {condition: service_healthy}

  redis:
    image: redis:7.4-alpine
    profiles: [voice]
    network_mode: host

  livekit:
    image: livekit/livekit-server:v1.13.10
    profiles: [voice]
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes: ["./deploy/livekit/livekit.yaml:/etc/livekit.yaml:ro"]
    network_mode: host   # RTC/UDP-Portbereiche; auf Linux-Hosts empfohlen
    depends_on: [redis]

  livekit-sip:
    image: livekit/sip:v1.21.0
    profiles: [voice]
    environment:
      SIP_CONFIG_FILE: /etc/sip.yaml
    volumes: ["./deploy/livekit/sip.yaml:/etc/sip.yaml:ro"]
    network_mode: host   # SIP 5060/UDP und RTP-Portbereich
    depends_on: [redis, livekit]

  voice-agent:
    build:
      context: .
      args: {MIT_VOICE: "1"}
    profiles: [voice]
    command: ["python", "-m", "voice.agent", "start"]
    environment:
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      CORE_URL: http://127.0.0.1:8100
      CORE_API_KEY: ${CORE_API_KEY}
      CORE_MANDANT: ${CORE_MANDANT}
      BETRIEB_NAME: ${BETRIEB_NAME}
      STT_ANBIETER: ${STT_ANBIETER:-azure}
      TTS_ANBIETER: ${TTS_ANBIETER:-azure}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-germanywestcentral}
      TTS_STIMME: ${TTS_STIMME:-de-DE-KatjaNeural}
      LLM_ANBIETER: ${LLM_ANBIETER:-anthropic}
      LLM_MODELL: ${LLM_MODELL:-claude-haiku-5-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
    network_mode: host
    depends_on: [livekit, core]

  n8n:
    image: n8nio/n8n:2.45.1
    profiles: [ops]
    ports: ["127.0.0.1:5678:5678"]
    environment:
      GENERIC_TIMEZONE: Europe/Berlin
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes: [n8n-daten:/home/node/.n8n]

  keycloak:   # lokal im Entwicklungsmodus; Produktion: deploy/server/docker-compose.prod.yml
    image: quay.io/keycloak/keycloak:26.0.7
    profiles: [auth]
    command: ["start-dev", "--http-port", "8180", "--import-realm"]
    ports: ["127.0.0.1:8180:8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      SHK_OEFFENTLICHE_URL: ${SHK_OEFFENTLICHE_URL:-http://localhost:8100}
    volumes: ["./deploy/keycloak/shk-realm.json:/opt/keycloak/data/import/shk-realm.json:ro"]

  fuseki:
    image: stain/jena-fuseki:5.1.0
    profiles: [ontologie]
    ports: ["127.0.0.1:3030:3030"]
    environment:
      ADMIN_PASSWORD: ${POSTGRES_PASSWORD}
      FUSEKI_DATASET_1: shk
    volumes: [fuseki-daten:/fuseki]

  osrm:   # Fahrzeiten und Touren; Kartenausschnitt vorher mit deploy/osrm/vorbereiten.sh erzeugen
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: [routing]
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "200", "/data/karte.osrm"]
    ports: ["127.0.0.1:5000:5000"]
    volumes: [osrm-daten:/data]

  ntfy:   # Push-Hinweise an das Telefon des Inhabers; Topic und Token in den Einstellungen → Anbindungen → Push
    image: binwiederhier/ntfy:v2.11.0
    profiles: [push]
    command: ["serve"]
    ports: ["127.0.0.1:8200:80"]
    environment:
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://localhost:8200}
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_BEHIND_PROXY: "true"
    volumes: [ntfy-daten:/var/lib/ntfy, ntfy-cache:/var/cache/ntfy]

  prometheus:   # Metriken des Core (/metrics mit API-Schlüssel) und Alarmregeln; Grafana (AGPL) bewusst nicht enthalten
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    ports: ["127.0.0.1:9090:9090"]
    environment:
      CORE_API_KEY: ${CORE_API_KEY}
    volumes: ["./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./deploy/monitoring/regeln.yml:/etc/prometheus/regeln.yml:ro",
              "./deploy/monitoring/api-key.sh:/etc/prometheus/api-key.sh:ro", prometheus-daten:/prometheus]
    entrypoint: ["/bin/sh", "/etc/prometheus/api-key.sh"]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: [monitoring]
    ports: ["127.0.0.1:9093:9093"]
    volumes: ["./deploy/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]

volumes:
  postgres-daten:
  export:
  n8n-daten:
  fuseki-daten:
  osrm-daten:
  ntfy-daten:
  ntfy-cache:
  prometheus-daten:
