# Datenbankmigrationen (Alembic). Ausführen mit `python -m core migrate`; die Verbindung kommt aus
# MIGRATION_DATABASE_URL bzw. DATABASE_URL und braucht DDL-Rechte (Eigentümerrolle, nicht shk_app).
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,alembic

[handlers]
keys = konsole

[formatters]
keys = einfach

[logger_root]
level = WARNING
handlers = konsole

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_konsole]
class = StreamHandler
args = (sys.stderr,)
formatter = einfach

[formatter_einfach]
format = %(levelname)s %(name)s: %(message)s
