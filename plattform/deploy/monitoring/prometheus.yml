# Prometheus für den Core-Service: /metrics verlangt das Recht „verwalten“, daher den API-Schlüssel als Kopfzeile.
# api-key.sh ersetzt __CORE_API_KEY__ beim Start aus der Umgebung (kein Geheimnis in dieser Datei).
global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/regeln.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: shk-core
    metrics_path: /metrics
    static_configs:
      - targets: ["core:8100"]
    http_headers:
      X-API-Key:
        values: ["__CORE_API_KEY__"]
