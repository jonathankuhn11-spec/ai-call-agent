# Alarme per E-Mail an den Betreiber; SMTP-Werte eintragen. Alternativ ntfy als Webhook-Empfänger (Profil push).
global:
  smtp_smarthost: "smtp.example.invalid:587"
  smtp_from: "alarm@example.invalid"
  smtp_auth_username: ""
  smtp_auth_password: ""
route:
  receiver: betreiber
  group_by: [alertname, mandant]
  group_wait: 1m
  repeat_interval: 4h
receivers:
  - name: betreiber
    email_configs:
      - to: "betreiber@example.invalid"
        send_resolved: true
    # webhook_configs:
    #   - url: "http://ntfy/shk-alarm"   # ntfy-Topic im Profil push
