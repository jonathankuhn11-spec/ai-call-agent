<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>Ihr Vorgang</title>
  <link rel="icon" href="data:,">
  <style>
    :root { --tinte: #18212b; --leise: #5f6b78; --rand: #e4e8ee; --akzent: #0b5cad; --ok: #1d7a46; --warn: #a86400; --flaeche: #f4f6f9; --karte: #fff; --schatten: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.04);
            --ok-flaeche: #e3f3ea; --warn-flaeche: #fff2e5; --fehler: #9b1c1c; --fehler-flaeche: #fde8e8; --leiste: #eef2f6; }
    @media (prefers-color-scheme: dark) {
      :root { --tinte: #e8edf3; --leise: #a0abb9; --rand: #262f3a; --akzent: #6aaef5; --ok: #5fcf8f; --warn: #f0b354; --flaeche: #0e1319; --karte: #161c24; --schatten: 0 1px 2px rgba(0,0,0,.35);
              --ok-flaeche: #16382a; --warn-flaeche: #3b2a16; --fehler: #ff9a9a; --fehler-flaeche: #3d1b1b; --leiste: #223040; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--tinte); background: var(--flaeche); line-height: 1.5; font-size: 17px; }
    main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
    header { margin-bottom: 18px; } header h1 { font-size: 1.5rem; margin: 0 0 4px; letter-spacing: -.01em; } header p { margin: 0; color: var(--leise); }
    .karte { background: var(--karte); border: 1px solid var(--rand); border-radius: 14px; padding: 20px; margin-bottom: 14px; box-shadow: var(--schatten); }
    .karte h2 { font-size: 1.1rem; margin: 0 0 10px; } .karte h3 { font-size: 1rem; margin: 16px 0 6px; }
    .termin { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--rand); }
    .termin:first-of-type { border-top: 0; }
    .status { font-size: .85rem; padding: 3px 10px; border-radius: 999px; background: var(--leiste); color: var(--leise); }
    .status.bestaetigt { background: var(--ok-flaeche); color: var(--ok); } .status.vorgeschlagen { background: var(--warn-flaeche); color: var(--warn); }
    button, .knopf { font: inherit; font-size: 1rem; font-weight: 600; min-height: 46px; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--akzent); background: var(--akzent); color: #fff; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    button.leise, .knopf.leise { background: transparent; color: var(--akzent); } button:disabled { opacity: .5; cursor: default; }
    .aktionen { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .hinweis { padding: 12px 14px; border-radius: 10px; background: var(--ok-flaeche); color: var(--ok); margin-top: 10px; }
    .fehler { padding: 12px 14px; border-radius: 10px; background: var(--fehler-flaeche); color: var(--fehler); margin-top: 10px; }
    textarea, input, select { width: 100%; font: inherit; padding: 10px; border: 1px solid var(--rand); border-radius: 10px; margin: 6px 0; background: var(--karte); color: var(--tinte); min-height: 44px; }
    .aktionen input, .aktionen select { width: auto; flex: 1 1 140px; }
    table { width: 100%; border-collapse: collapse; } td { padding: 8px 0; border-top: 1px solid var(--rand); vertical-align: top; } td:last-child { text-align: right; white-space: nowrap; }
    footer { color: var(--leise); font-size: .9rem; margin-top: 24px; } footer a { color: var(--leise); }
    a { color: var(--akzent); }
    /* Zeitachse */
    .verlauf { list-style: none; margin: 0; padding: 0; }
    .verlauf li { position: relative; padding: 0 0 14px 34px; }
    .verlauf li::before { content: ""; position: absolute; left: 9px; top: 24px; bottom: -2px; width: 2px; background: var(--rand); }
    .verlauf li:last-child::before { display: none; }
    .verlauf .punkt { position: absolute; left: 0; top: 2px; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--rand); background: var(--karte); }
    .verlauf .erledigt .punkt { background: var(--ok); border-color: var(--ok); }
    .verlauf .erledigt .punkt::after { content: "✓"; color: #fff; font-size: 12px; position: absolute; left: 3px; top: -2px; }
    .verlauf .aktiv .punkt { border-color: var(--akzent); background: var(--akzent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--akzent) 25%, transparent); animation: puls 1.6s infinite; }
    @keyframes puls { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--akzent) 45%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
    .verlauf .titel { font-weight: 600; } .verlauf .offen .titel { color: var(--leise); font-weight: 400; }
    .verlauf small { color: var(--leise); display: block; }
    /* Alternativen, Sterne, GiroCode */
    .fenster { display: grid; gap: 8px; grid-template-columns: 1fr; margin-top: 8px; }
    .fenster button { justify-content: space-between; width: 100%; background: transparent; color: var(--tinte); border-color: var(--rand); }
    .fenster button:hover { border-color: var(--akzent); }
    .sterne { display: flex; gap: 4px; font-size: 2rem; line-height: 1; } .sterne button { background: none; border: 0; color: var(--rand); padding: 0 2px; min-height: 0; font-size: inherit; cursor: pointer; }
    .sterne button.an { color: #f2b01e; }
    .girocode { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 8px; } .girocode img { width: 150px; height: 150px; border-radius: 8px; background: #fff; padding: 4px; }
    @media (max-width: 480px) { .termin { flex-direction: column; align-items: stretch; } .termin .aktionen button { flex: 1; justify-content: center; } }
    /* Kundenfreundlich: Nächster Schritt, Schnellkontakt, Fokus */
    .naechster { border-left: 6px solid var(--akzent); } .naechster .etikett { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--akzent); font-weight: 700; margin-bottom: 4px; }
    .naechster h2 { font-size: 1.3rem; } .naechster.info { border-left-color: var(--ok); } .naechster.info .etikett { color: var(--ok); }
    .leiste { position: sticky; bottom: 0; display: flex; gap: 8px; padding: 10px 0 12px; background: linear-gradient(180deg, transparent, var(--flaeche) 30%); }
    .leiste a { flex: 1; display: inline-flex; justify-content: center; align-items: center; min-height: 48px; border-radius: 12px; background: var(--karte); border: 1px solid var(--rand); color: var(--tinte); text-decoration: none; font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,.08); }
    .skip { position: absolute; left: -9999px; } .skip:focus { left: 12px; top: 12px; background: var(--karte); padding: 8px 12px; z-index: 10; }
    a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--akzent) 30%, transparent); border-color: var(--akzent); }
    @media (prefers-reduced-motion: reduce) { .verlauf .aktiv .punkt { animation: none; } }
  </style>
</head>
<body>
<a class="skip" href="#inhalt">Zum Inhalt springen</a>
<main id="inhalt" aria-live="polite"><p>Wird geladen …</p></main>
<script src="/portal/portal.js"></script>
</body>
</html>
