[project]
name = "ai-call-agent"
version = "1.1.0"
description = "Call-Agent mit Tool-Calling, UAT gegen simulierte Kunden und Integrationsschicht für die Voice-Plattform telli"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.ruff]
line-length = 150
target-version = "py312"
extend-exclude = ["telli-konfig"]

[tool.ruff.lint]
# F: Fehler, E9: Syntax, B: wahrscheinliche Bugs, SIM/C4: Vereinfachungen, I: Importreihenfolge
select = ["F", "E9", "B", "SIM", "C4", "I"]
ignore = [
    "B905",     # zip() ohne strict=: Zeilen und Spaltenlisten aus DuckDB sind gleich lang
    "PERF203",  # try/except in Schleifen ist hier Absicht (Zustellung einzeln wiederholen)
    "SIM108",   # Ternär statt if/else nur, wo es lesbarer ist
    "SIM102",   # verschachtelte ifs, wo ein Kommentar die zweite Bedingung erklärt
    "SIM103",   # Guard-Ketten mit return True/False bleiben als Liste von Regeln lesbar
]

[tool.ruff.lint.isort]
known-first-party = ["agent", "guided", "jev", "simulate", "voice", "dashboard", "pilot_dashboard", "integrations"]

[tool.coverage.run]
source = ["agent", "guided", "integrations"]
omit = ["tests/*", "integrations/__main__.py"]

[tool.coverage.report]
skip_empty = true
