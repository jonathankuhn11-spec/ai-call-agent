name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements.txt ruff pytest-cov
      - name: Statische Prüfung (Regeln in pyproject.toml, Fehler, wahrscheinliche Bugs, Importreihenfolge)
        run: ruff check .
      - name: Tests mit Abdeckung (ohne Ollama, ohne Jev-Zugang, ohne Plattform-Account; die Zeit steht in den Tests)
        run: |
          python -m pytest -q --cov --cov-report=term --cov-report=markdown:coverage.md --cov-fail-under=90
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Integrationsschicht, Demo im Prozess (beide Use Cases, Plattform-Simulator, Attrappen-Kundensystem)
        run: python -m integrations demo
      - name: Lasttest (40 Gespräche, 10 parallel, Outbox liefert währenddessen an ein langsames Kundensystem; geteilte Runner schwanken, Staging-Schwelle ist 300 ms)
        run: python scripts/lasttest.py --gespraeche 40 --parallel 10 --schwelle-ms 400
      - name: Konfigurationspakete für den Plattform-Builder erzeugen (müssen mit docs/telli-konfig übereinstimmen)
        run: |
          python -m integrations konfigpaket --alle --out telli-konfig
          diff -r telli-konfig docs/telli-konfig
      - name: Abnahme von außen gegen einen laufenden Server mit Geheimnissen (python -m integrations check, Go/No-Go)
        env:
          TOOL_SECRET: ci-tool-secret
          TELLI_API_KEY: ci-api-key
          TELLI_WEBHOOK_SECRET: whsec_Y2ktd2ViaG9vay1zZWNyZXQ=
          DB_PATH: ci-check.duckdb
        run: |
          python -m integrations serve --port 8011 > serve.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8011/health > /dev/null 2>&1 && break; sleep 0.5; done
          python -m integrations check --url http://127.0.0.1:8011 --protokoll abnahme.md --kunde CI
          kill %1
      - uses: actions/upload-artifact@v5
        with:
          name: telli-konfig
          path: telli-konfig
      - uses: actions/upload-artifact@v5
        with:
          name: abnahmeprotokoll
          path: abnahme.md

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Image bauen
        run: docker build -t ai-call-agent-integrations:ci .
      - name: Demo im Container
        run: docker run --rm ai-call-agent-integrations:ci python -m integrations demo
      - name: Server im Container starten und Healthcheck abwarten
        run: |
          docker run -d --name integrations -p 8000:8000 ai-call-agent-integrations:ci
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' integrations)
            echo "Health: $status"
            if [ "$status" = "healthy" ]; then break; fi
            if [ "$status" = "unhealthy" ]; then docker logs integrations; exit 1; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/health
          docker stop integrations
