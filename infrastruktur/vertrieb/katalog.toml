# Vertriebssteuerung KUHN: Parameter der Priorisierung, Zusatzmodule (Upsell), Nachfasskadenz und Versandkosten.
# Editionspreise kommen aus unterlagen/preise.toml (eine Quelle der Wahrheit); hier stehen nur Zusatzleistungen.
# Alle Beträge netto in Euro. "status" kennzeichnet Preise, die noch nicht beschlossen sind.

[modell]
# Prior der positiven Reaktion je Brief (Antwort, Rückruf, Termin) in Abhängigkeit vom Abschluss-Score der Liste:
#   p0 = basis + spanne * (score/100)^exponent, akute Leads (frische Büroanzeige, verifiziert) * faktor_akut
basis = 0.008
spanne = 0.062
exponent = 2.0
faktor_akut = 1.5
# Konzern-/Gruppenbetrieb oder Niederlassung (Kfz-Liste „Konzern/Gruppe = ja“, „NL der …“): Entscheidung fällt zentral.
faktor_filiale = 0.4
p_max = 0.25
# Stärke des Segment-Priors in Pseudo-Beobachtungen (Empirical Bayes, Beta-Binomial). Höher = träger.
prior_staerke = 30
# Anteil der Charge, der per Thompson-Sampling zur Exploration vergeben wird (0 = rein gierig).
exploration = 0.2
# Bedingte Abschlusswahrscheinlichkeit nach positiver Reaktion (Termin -> Vertrag), bis eigene Daten vorliegen.
p_abschluss_nach_reaktion = 0.25
# Erwartete Vertragsdauer in Monaten für den Kundenwert (Mindestlaufzeit 12, Annahme Churn ~3 %/Monat).
vertragsmonate = 24
# Deckungsbeitragsquote auf den Monatsbetrag (variable Kosten je Kunde ca. 30–40 €/Monat, Plattform-Memo).
db_quote = 0.88

[versand]
porto_standardbrief = 0.95      # Deutsche Post Standardbrief bis 20 g
druck_kuvert = 0.35             # 2 Blatt Farbe + DIN-lang-Fenster
minuten_je_brief = 4            # Kuvertieren, Frankieren, Unterschrift
stundensatz_intern = 40
chargengroesse = 25
max_anteil_branche = 0.4        # Diversifikation: höchstens 40 % einer Charge aus einer Branche
sperrfrist_tage = 90            # erneuter Erstkontakt frühestens nach 90 Tagen

# Nachfasskadenz. Erstkontakt und Nachfass erfolgen schriftlich (Brief, § 7 Abs. 1 UWG: zulässig, solange kein
# erkennbarer Widerspruch). Telefon/E-Mail/WhatsApp erst nach dokumentierter Einwilligung bzw. Rückmeldung.
[kadenz]
nachfassbrief_nach_tagen = 14
kadenzende_nach_tagen = 35      # nach Brief 2 ohne Reaktion: Kadenz endet, Wiedervorlage
wiedervorlage_nach_tagen = 120
rueckruf_binnen_stunden = 24
angebot_nachfassen_nach_tagen = 7

# Zusatzmodule. Auslöser: P-Codes (any), Branchen (any), Schlagwörter in Stellenanzeige/Befund (any).
# Ein Modul wird vorgeschlagen, wenn mindestens eine Auslösergruppe greift und es nicht schon in der Edition steckt.
